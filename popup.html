<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Proxy Manager</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <!-- Иконки -->
        <svg class="sprite" aria-hidden="true">
            <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10" /><path d="M18.4 6.6a9 9 0 1 1-12.77.04" /></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></symbol>
            <symbol id="i-import" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect width="13" height="13" x="9" y="9" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></symbol>
            <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" /><path d="M8 16H3v5" /></symbol>
            <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></symbol>
            <symbol id="i-incognito" viewBox="0 0 24 24"><path d="M2 11h20" /><path d="M5 11 7.5 4h9l2.5 7" /><circle cx="7" cy="17" r="3" /><circle cx="17" cy="17" r="3" /><path d="M10 17h4" /></symbol>
            <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
            <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
            <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></symbol>
        </svg>

        <div class="app">
            <header class="header">
                <!-- Тот же рисунок, что в store/icons.js -->
                <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
                    <defs>
                        <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#7B6BFF" />
                            <stop offset="1" stop-color="#4433D6" />
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" rx="27" fill="url(#logo-gradient)" />
                    <path d="M50 17 L75 26.5 V46 C75 63.5 64.5 75.5 50 82.5 C35.5 75.5 25 63.5 25 46 V26.5 Z" fill="#fff" />
                    <g fill="none" stroke="#4433D6" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M38.5 43 H61 M54.5 36.5 L61 43 L54.5 49.5" />
                        <path d="M61.5 60 H39 M45.5 53.5 L39 60 L45.5 66.5" />
                    </g>
                </svg>
                <span class="title">Proxy Manager</span>
                <span id="version" class="version"></span>
            </header>

            <!-- Состояние подключения -->
            <section id="hero" class="hero"></section>

            <!-- Защита от утечек -->
            <section class="guard">
                <div class="guard-row">
                    <svg class="i guard-icon"><use href="#i-shield" /></svg>
                    <div class="guard-text">
                        <div class="guard-title">WebRTC</div>
                        <div id="webrtcSub" class="guard-sub"></div>
                    </div>
                    <label class="switch" title="Защита WebRTC">
                        <input type="checkbox" id="webrtcToggle" />
                        <span></span>
                    </label>
                </div>
                <div class="guard-row">
                    <svg class="i guard-icon"><use href="#i-incognito" /></svg>
                    <div class="guard-text">
                        <div class="guard-title">Инкогнито</div>
                        <div id="incognitoSub" class="guard-sub"></div>
                    </div>
                    <button id="incognitoBtn" class="btn btn-sm btn-secondary hidden" type="button">Разрешить</button>
                    <svg id="incognitoOk" class="i guard-ok hidden"><use href="#i-check" /></svg>
                </div>
            </section>

            <!-- Профили -->
            <section class="profiles">
                <div class="section-head">
                    <span class="section-title">Профили</span>
                    <span id="count" class="count"></span>
                    <span class="spacer"></span>
                    <button id="importBtn" class="icon-btn" type="button" title="Импорт и экспорт">
                        <svg class="i"><use href="#i-import" /></svg>
                    </button>
                    <button id="addBtn" class="icon-btn primary" type="button" title="Добавить прокси">
                        <svg class="i"><use href="#i-plus" /></svg>
                    </button>
                </div>
                <label id="searchWrap" class="search hidden">
                    <svg class="i"><use href="#i-search" /></svg>
                    <input id="search" type="text" placeholder="Поиск по названию или адресу" autocomplete="off" spellcheck="false" />
                </label>
                <div id="list" class="list"></div>
            </section>
        </div>

        <div id="overlay" class="overlay"></div>

        <!-- Добавление и редактирование -->
        <div id="profileSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="profileSheetTitle">
            <form id="profileForm" class="sheet-form" novalidate>
                <div class="sheet-head">
                    <h2 id="profileSheetTitle" class="sheet-title">Новый прокси</h2>
                    <button class="icon-btn" type="button" data-close title="Закрыть"><svg class="i"><use href="#i-x" /></svg></button>
                </div>
                <div class="sheet-body">
                    <div class="field">
                        <label for="quickInput">Строка прокси</label>
                        <div class="input-icon">
                            <svg class="i"><use href="#i-link" /></svg>
                            <input id="quickInput" class="input mono" type="text" placeholder="user:pass@203.0.113.5:8080" autocomplete="off" spellcheck="false" />
                        </div>
                        <div id="quickHint" class="hint"></div>
                    </div>

                    <div class="field">
                        <label for="nameInput">Название</label>
                        <input id="nameInput" class="input" type="text" autocomplete="off" />
                    </div>

                    <div class="field">
                        <label>Тип</label>
                        <div id="typeSeg" class="segmented" role="radiogroup">
                            <button type="button" data-value="http">HTTP</button>
                            <button type="button" data-value="socks5">SOCKS5</button>
                            <button type="button" data-value="socks4">SOCKS4</button>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="hostInput">Адрес</label>
                            <input id="hostInput" class="input mono" type="text" placeholder="203.0.113.5" autocomplete="off" spellcheck="false" />
                        </div>
                        <div class="field">
                            <label for="portInput">Порт</label>
                            <input id="portInput" class="input mono" type="text" inputmode="numeric" placeholder="8080" autocomplete="off" />
                        </div>
                    </div>

                    <!-- Логин и пароль: для SOCKS вместо полей пояснение той же высоты -->
                    <div class="auth-area">
                        <div id="authFields" class="row row-2">
                            <div class="field">
                                <label for="userInput">Логин</label>
                                <input id="userInput" class="input" type="text" autocomplete="off" spellcheck="false" />
                            </div>
                            <div class="field">
                                <label for="passInput">Пароль</label>
                                <div class="password">
                                    <input id="passInput" class="input" type="password" autocomplete="off" spellcheck="false" />
                                    <button id="showPassBtn" class="icon-btn" type="button" title="Показать пароль"><svg class="i"><use href="#i-eye" /></svg></button>
                                </div>
                            </div>
                        </div>
                        <div id="socksNote" class="note hidden"></div>
                    </div>

                    <div id="formError" class="form-error"></div>
                </div>
                <div class="sheet-foot">
                    <span class="spacer"></span>
                    <button class="btn btn-secondary" type="button" data-close>Отмена</button>
                    <button class="btn btn-primary" type="submit">Сохранить</button>
                </div>
            </form>
        </div>

        <!-- Импорт -->
        <div id="importSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="importSheetTitle">
            <div class="sheet-head">
                <h2 id="importSheetTitle" class="sheet-title">Импорт прокси</h2>
                <button class="icon-btn" type="button" data-close title="Закрыть"><svg class="i"><use href="#i-x" /></svg></button>
            </div>
            <div class="sheet-body">
                <textarea
                    id="importText"
                    class="input mono"
                    rows="7"
                    spellcheck="false"
                    placeholder="user:pass@203.0.113.5:8080&#10;203.0.113.6:8080:user:pass&#10;socks5://198.51.100.7:1080"
                ></textarea>
                <div class="field">
                    <label>Тип для строк без схемы</label>
                    <div id="importTypeSeg" class="segmented" role="radiogroup">
                        <button type="button" data-value="http">HTTP</button>
                        <button type="button" data-value="socks5">SOCKS5</button>
                        <button type="button" data-value="socks4">SOCKS4</button>
                    </div>
                </div>
                <div class="import-report">
                    <div id="importSummary" class="import-summary"></div>
                    <div id="importErrors" class="import-errors"></div>
                </div>
            </div>
            <div class="sheet-foot">
                <button id="exportBtn" class="btn btn-ghost" type="button" title="Скопировать все профили в буфер обмена">Экспорт всех</button>
                <span class="spacer"></span>
                <button class="btn btn-secondary" type="button" data-close>Отмена</button>
                <button id="confirmImportBtn" class="btn btn-primary" type="button">Импортировать</button>
            </div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite">
            <span id="toastText"></span>
            <button id="toastAction" class="toast-action hidden" type="button"></button>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
